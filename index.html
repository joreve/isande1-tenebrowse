<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tenebrowse - Login</title>
    
    <!-- FontAwesome for Enterprise Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Core Design System CSS Reference -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="page-transition">

    <div class="login-wrapper">
        <!-- Toast Container Component Injection Point -->
        <div class="toast-container" id="toastContainer"></div>

        <!-- Centered Login Card -->
        <div class="login-card">
            
            <!-- System Name and Branding Elements -->
            <div class="login-brand">
                <div class="login-logo-icon">
                    <img src="assets/logo.png" alt="Icon" class="login-brand-logo">
                </div>
                <h1 class="login-title">Tenebrowse</h1>
                <div class="login-tagline">Connect. Complete. Construct.</div>
            </div>

            <!-- Intercepted Validation Form Shell -->
            <form id="loginForm" novalidate>
                
                <!-- Username Field -->
                <div class="form-group" id="usernameGroup">
                    <label class="form-label" for="username">Username / Email</label>
                    <div class="input-wrapper">
                        <input class="form-control" type="text" id="username" placeholder="Enter corporate identity ID" autocomplete="username">
                    </div>
                    <div class="error-message" id="usernameError">Username context validation field missing.</div>
                </div>

                <!-- Password Field -->
                <div class="form-group" id="passwordGroup">
                    <label class="form-label" for="password">Security Password</label>
                    <div class="input-wrapper">
                        <input class="form-control" type="password" id="password" placeholder="••••••••" autocomplete="current-password">
                        <button type="button" class="password-toggle-btn" id="passwordToggle" aria-label="Toggle password visibility">
                            <i class="far fa-eye"></i>
                        </button>
                    </div>
                    <div class="error-message" id="passwordError">Security protocol passcode context missing.</div>
                </div>

                <!-- Remember Me / Forgot Password Configuration Actions -->
                <div class="form-options">
                    <label class="remember-me-label">
                        <input type="checkbox" id="rememberMe">
                        <span>Remember access profile</span>
                    </label>
                    <a href="#" class="forgot-password-link" onclick="event.preventDefault(); alert('Enterprise Notice: Password restoration structures must be executed directly via internal Helpdesk systems.');">Forgot credentials?</a>
                </div>

                <!-- Form Action Event Driver -->
                <button type="submit" class="btn btn-primary btn-login">
                    <span>Secure Access Portal</span> <i class="fas fa-arrow-right"></i>
                </button>
            </form>
        </div>

        <!-- Explicit Legal / Product Version Tracking Footers -->
        <footer class="login-footer">
            <div>Application Ecosystem Environment Platform v1.0.0-Prototype</div>
            <div>&copy; 2026 Tenebrowse Logistics & Infrastructure Operations. All rights reserved.</div>
        </footer>
    </div>

    <!-- Core Functional Application Scripts Insertion Framework -->
    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const loginForm = document.getElementById('loginForm');
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            const passwordToggle = document.getElementById('passwordToggle');
            
            // Reusable Error Parsing Utilities
            const clearErrors = () => {
                document.querySelectorAll('.form-group').forEach(group => group.classList.remove('has-error'));
                document.querySelectorAll('.error-message').forEach(err => err.style.display = 'none');
            };

            // Interactive Password Visibility Engine Toggle
            if (passwordToggle && passwordInput) {
                passwordToggle.addEventListener('click', () => {
                    const typeAttribute = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                    passwordInput.setAttribute('type', typeAttribute);
                    
                    // Icon Variant Management Sync
                    const iconElement = passwordToggle.querySelector('i');
                    if (typeAttribute === 'text') {
                        iconElement.className = 'far fa-eye-slash';
                    } else {
                        iconElement.className = 'far fa-eye';
                    }
                });
            }

            // Client Validation Form Controller Link Execution Rules
            if (loginForm) {
                loginForm.addEventListener('submit', (e) => {
                    e.preventDefault();
                    clearErrors();

                    let clientFormIsValid = true;
                    const usernameVal = usernameInput.value.trim();
                    const passwordVal = passwordInput.value.trim();

                    // Static Context Processing Validation Checks
                    if (!usernameVal) {
                        document.getElementById('usernameGroup').classList.add('has-error');
                        document.getElementById('usernameError').style.display = 'block';
                        clientFormIsValid = false;
                    }

                    if (!passwordVal) {
                        document.getElementById('passwordGroup').classList.add('has-error');
                        document.getElementById('passwordError').style.display = 'block';
                        clientFormIsValid = false;
                    }

                    // Execution Branch Path Forward Redirect Mapping Strategy
                    if (clientFormIsValid) {
                        if (typeof window.showToast === 'function') {
                            window.showToast('Validation Verified', 'Authorization criteria processed successfully. Mounting internal desktop application metrics...', 'success');
                        }
                        
                        // Added page transition exit effect before routing
                        setTimeout(() => {
                            document.body.classList.add('page-exit');
                            setTimeout(() => {
                                window.location.href = 'dashboard.html';
                            }, 300);
                        }, 500);
                    } else {
                        if (typeof window.showToast === 'function') {
                            window.showToast('Authentication Interrupted', 'Please resolve highlighted configuration compliance inputs.', 'danger');
                        }
                    }
                });
            }
        });
    </script>
</body>
</html>
